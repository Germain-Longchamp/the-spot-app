<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Galerie de l'événement</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#AD354E}a:hover{color:#8E2A3F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6EDE3; font-family: Inter, system-ui, sans-serif; color: #2B1A1E; display: flex; flex-direction: column; padding: 20px 20px 0; gap: 14px; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
    <a href="1-accueil.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; text-decoration: none; color: #2B1A1E; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B1A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Accueil
    </a>
    <img src="../assets/icone-couleur.png" alt="The Spot memories" style="width: 28px; height: 28px">
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; color: #AD354E">Galerie</h1>
    <span style="font-size: 13px; color: #5A474B">24 photos</span>
  </div>

  <div style="display: flex; justify-content: center; position: absolute; top: 132px; left: 0; right: 0; z-index: 2">
    <button type="button" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #2B1A1E; color: #FFFFFF; font-size: 13.5px; font-weight: 600; box-shadow: 0 6px 16px rgba(43,26,30,0.25)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
      3 nouvelles photos
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding-top: 30px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="15">
      <a href="5-photo-en-grand.html" aria-label="Ouvrir la photo" style="display: block; position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: {{t.bg}}">
        <svg width="100%" height="100%" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block">
          <rect width="120" height="120" fill="{{t.bg}}"></rect>
          <rect y="86" width="120" height="34" fill="{{t.floor}}"></rect>
          <circle cx="{{t.x1}}" cy="50" r="12" fill="{{t.a}}"></circle><rect x="{{t.r1}}" y="64" width="30" height="60" rx="14" fill="{{t.a}}"></rect>
          <circle cx="{{t.x2}}" cy="54" r="11" fill="{{t.b}}"></circle><rect x="{{t.r2}}" y="67" width="28" height="56" rx="13" fill="{{t.b}}"></rect>
        </svg>
        <sc-if value="{{t.mine}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; left: 6px; bottom: 6px; padding: 3px 8px; border-radius: 999px; background: #FFFFFF; font-size: 11px; font-weight: 700; color: #AD354E">Vous</span>
        </sc-if>
      </a>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px">
    <a href="1-accueil.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; background: #AD354E; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; box-shadow: 0 8px 20px rgba(173,53,78,0.3)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      Prendre une photo
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var palettes = [
      ['#E9CFC0','#D9B3A2','#B06B6E','#8E4A55'],
      ['#F3DCC8','#E5BFA3','#AD354E','#5A474B'],
      ['#DCC7C2','#C7ABA4','#7C4A52','#C98C86'],
      ['#F0D7C7','#E2B99C','#C76F5A','#8E4A55'],
      ['#E6D3CC','#CDB2A8','#5A474B','#B06B6E']
    ];
    var mine = { 1: true, 9: true };
    var tiles = [];
    for (var i = 0; i < 15; i++) {
      var p = palettes[(i * 2 + Math.floor(i / 3)) % palettes.length];
      var shift = (i % 3) * 6 - 6;
      tiles.push({
        bg: p[0], floor: p[1], a: p[2], b: p[3],
        x1: 44 + shift, r1: 29 + shift, x2: 78 + shift, r2: 64 + shift,
        mine: !!mine[i]
      });
    }
    return { tiles: tiles };
  }
}
</script>
</body>
</html>
