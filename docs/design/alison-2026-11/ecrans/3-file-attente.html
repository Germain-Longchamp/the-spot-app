<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vos tirages en cours</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#AD354E}a:hover{color:#8E2A3F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6EDE3; font-family: Inter, system-ui, sans-serif; color: #2B1A1E; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
    <a href="1-accueil.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; text-decoration: none; color: #2B1A1E; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B1A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Accueil
    </a>
    <img src="../assets/icone-couleur.png" alt="The Spot memories" style="width: 28px; height: 28px">
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #5A474B">File d'impression</span>
    <h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; color: #AD354E">Vos tirages</h1>
    <span style="font-size: 14px; color: #5A474B">1 prêt · 2 en attente</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{prints}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px; background: #FFFFFF; border-radius: 16px; border: {{p.border}}">
        <div style="width: 64px; background: #FFFFFF; padding: 4px 4px 0; box-sizing: border-box; border-radius: 3px; box-shadow: 0 3px 10px rgba(43,26,30,0.16); flex-shrink: 0">
          <svg width="56" height="56" viewBox="0 0 120 120" role="img" aria-label="Votre photo" style="display: block">
            <rect width="120" height="120" fill="{{p.bg}}"></rect><rect y="86" width="120" height="34" fill="{{p.floor}}"></rect>
            <circle cx="44" cy="50" r="12" fill="{{p.a}}"></circle><rect x="29" y="64" width="30" height="60" rx="14" fill="{{p.a}}"></rect>
            <circle cx="78" cy="54" r="11" fill="{{p.b}}"></circle><rect x="64" y="67" width="28" height="56" rx="13" fill="{{p.b}}"></rect>
          </svg>
          <div style="height: 16px"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; font-weight: 700; color: #AD354E">« {{p.mot}} »</span>
          <span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: {{p.chipBg}}; font-size: 12.5px; font-weight: 600; color: #2B1A1E">{{p.status}}</span>
          <span style="font-size: 12.5px; color: #5A474B">{{p.detail}}</span>
        </div>
        <sc-if value="{{p.hasRank}}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0; min-width: 44px">
            <span style="font-size: 24px; font-weight: 700; color: #2B1A1E; line-height: 1">{{p.rank}}<sup style="font-size: 11px">e</sup></span>
            <span style="font-size: 11px; color: #5A474B">dans la file</span>
          </span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #FBE3D2">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B1A1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4l3 2"></path></svg>
    <span style="font-size: 13px; line-height: 1.45; color: #2B1A1E">Vous pouvez fermer cette page et profiter de la soirée : vos places sont gardées. On vous indique ici quand c'est prêt.</span>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="1-accueil.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #AD354E; color: #AD354E; text-decoration: none; font-size: 16px; font-weight: 600">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AD354E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    Prendre une autre photo
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      prints: [
        { mot: 'Les copines du lycée', status: 'Prête à récupérer', detail: 'Elle vous attend près de l’imprimante', chipBg: '#EC9A62', border: '2px solid #EC9A62', hasRank: false, rank: '', bg: '#F0D7C7', floor: '#E2B99C', a: '#C76F5A', b: '#8E4A55' },
        { mot: 'Vive les mariés !', status: 'En attente', detail: 'Environ 2 min', chipBg: '#F6EDE3', border: '1px solid #EADFE2', hasRank: true, rank: '3', bg: '#E9CFC0', floor: '#D9B3A2', a: '#B06B6E', b: '#8E4A55' },
        { mot: 'Tonton Michel en feu', status: 'En attente', detail: 'Environ 5 min', chipBg: '#F6EDE3', border: '1px solid #EADFE2', hasRank: true, rank: '6', bg: '#DCC7C2', floor: '#C7ABA4', a: '#7C4A52', b: '#C98C86' }
      ]
    };
  }
}
</script>
</body>
</html>
