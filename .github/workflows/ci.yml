name: CI

# Runs on every push to any branch, so a pull request's head commit always
# carries these checks. Branch protection on main requires them before merge.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      # Placeholders only: no test talks to a real Supabase project yet.
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/print-agent/package-lock.json
      - run: npm ci
      # The tests check the agent's page composition with its own sharp
      # (SCRUM-65): its packages must be there before the types and tests.
      - run: npm ci
        working-directory: apps/print-agent
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  print-agent:
    name: Print agent (types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/print-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/print-agent/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Unit tests cannot see a crash at startup: runs the real program with no
      # server to reach, then checks that it survives and stops cleanly.
      - name: Start and stop the agent
        env:
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_SERVICE_ROLE_KEY: not-a-real-key
          EVENT_ID: 00000000-0000-0000-0000-000000000001
          POLL_INTERVAL_MS: 300
        run: |
          node dist/index.js > agent.log 2>&1 &
          agent=$!
          sleep 3
          kill -TERM "$agent"
          wait "$agent"
          grep -q "arrêté" agent.log
